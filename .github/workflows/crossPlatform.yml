name: Cross-platform verification

# Automatic verification is intentionally paused during the project's beta phase.
# Keep the workflow manually available while cross-platform validation matures.
on:
    workflow_dispatch:

jobs:
    verify:
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        env:
            VCPKG_DISABLE_METRICS: 1
            # Caches vcpkg's built dependency binaries in GitHub's own Actions cache instead of
            # rebuilding all of them from source on every run -- see release.yml for the same.
            VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
            MACOSX_DEPLOYMENT_TARGET: '11.0'
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24.19.0
                  cache: npm
            - uses: ilammy/msvc-dev-cmd@v1
              if: runner.os == 'Windows'
            - name: Export GitHub Actions cache environment variables
              uses: actions/github-script@v7
              with:
                  script: |
                      core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
                      core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            - name: Exclude build directories from Windows Defender
              if: runner.os == 'Windows'
              run: |
                  Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\out"
                  Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\.tools"
            - name: Install macOS METIS
              if: runner.os == 'macOS'
              # engine/CMakeLists.txt refuses to configure if METIS resolves to vcpkg's static
              # build on macOS (a combination that previously corrupted the live simulation event
              # stream at runtime instead of failing at build time) -- it must come from Homebrew.
              run: brew install metis
            - name: Install Linux Electron prerequisites
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libnss3 libasound2t64
            - run: npm ci
            # Deliberately not using the Ninja generator on Windows -- see release.yml's Build
            # distributable step for why (compiler auto-detection under Ninja picked up this
            # runner's preinstalled MinGW-w64 ahead of MSVC, and this codebase is MSVC-only on
            # Windows by design). The Visual Studio generator default sidesteps that entirely.
            - run: npm run setup
            - run: npm test
            - run: npm run test:engine
            - name: Install package engine layout
              run: cmake --install out/engine --config RelWithDebInfo --prefix out/packageResources/engine
            - run: cmake -E copy ThirdPartyNotices.md out/packageResources
            - run: cmake -E copy_directory thirdPartyLicenses out/packageResources/thirdPartyLicenses
            - name: Verify installed METIS runtime and notices
              run: node scripts/verifyPackagingNotices.mjs out/packageResources
            - name: Turn off App Nap for the interaction tests
              # Nobody looks at a runner's window, so macOS can nap the app, which throttles the timers of it and of the
              # engine it starts: real-time runs then fall far behind the clock and never finish in time.
              if: runner.os == 'macOS'
              run: defaults write NSGlobalDomain NSAppSleepDisabled -bool YES
            # TEMPORARY: the interaction tests do not fail this job. They fail now and then on slow runners, on different
            # scenarios and platforms, for timing rather than for bugs; until they are made robust (each waiting on the app's
            # state, never on the clock, and proven by repeated runs under load) a failure only shows, listed with what it said
            # in the job summary, with the log and a screenshot of each failure uploaded. Remove continue-on-error to make them
            # blocking again. (release.yml's packaged interaction tests are non-blocking in the same way.)
            - name: Run Electron interaction tests
              id: interaction
              if: runner.os != 'Linux'
              continue-on-error: true
              env:
                  KONJUGATE_INTERACTION_ARTIFACTS: ${{ github.workspace }}/out/interactionArtifacts
              run: npm run test:interaction
            - name: Run Electron interaction tests with a virtual display
              id: interactionLinux
              if: runner.os == 'Linux'
              continue-on-error: true
              env:
                  KONJUGATE_INTERACTION_ARTIFACTS: ${{ github.workspace }}/out/interactionArtifacts
              run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run test:interaction
            - name: Say that the interaction tests failed without blocking
              if: steps.interaction.outcome == 'failure' || steps.interactionLinux.outcome == 'failure'
              shell: bash
              run: |
                  echo "::warning title=Interaction tests failed (not blocking)::See the job summary and the interaction-${RUNNER_OS}-${RUNNER_ARCH} artifact. They do not fail this job for now."
                  printf '\n> The interaction tests failed; for now that does not fail this job.\n' >> "$GITHUB_STEP_SUMMARY"
            - name: Upload the interaction tests' logs and screenshots
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: interaction-${{ runner.os }}-${{ runner.arch }}
                  path: out/interactionArtifacts
                  if-no-files-found: ignore
                  retention-days: 14
            - run: npm run build:engine:no-metis
            - name: Test dependency-free partitioner
              working-directory: engine
              run: ctest --preset development-no-metis

    sanitize:
        # A separate, focused job rather than a matrix entry on `verify` above: this only needs
        # to build and exercise the C++ engine itself (see engine/CMakePresets.json's "sanitize"
        # preset) under ASan+UBSan, not package or launch the Electron app, so it skips all of
        # that job's packaging/interaction-test steps entirely. Linux-only for now -- ASan/UBSan
        # work under Clang on macOS too (verified locally), but one platform is enough to start
        # catching real memory-safety and undefined-behavior regressions without doubling CI time.
        runs-on: ubuntu-latest
        env:
            VCPKG_DISABLE_METRICS: 1
            VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24.19.0
                  cache: npm
            - name: Export GitHub Actions cache environment variables
              uses: actions/github-script@v7
              with:
                  script: |
                      core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
                      core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            - run: npm ci
            - run: npm run setup
            - run: npm run test:engine:sanitize
