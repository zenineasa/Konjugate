name: Cross-platform verification

# Automatic verification is intentionally paused during early-alpha development.
# Keep the workflow manually available while cross-platform validation matures.
on:
    workflow_dispatch:

jobs:
    verify:
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        env:
            VCPKG_DISABLE_METRICS: 1
            # Caches vcpkg's built dependency binaries in GitHub's own Actions cache instead of
            # rebuilding all of them from source on every run -- see release.yml for the same.
            VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.12.0
                  cache: npm
            - uses: ilammy/msvc-dev-cmd@v1
              if: runner.os == 'Windows'
            - name: Export GitHub Actions cache environment variables
              uses: actions/github-script@v7
              with:
                  script: |
                      core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
                      core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            - name: Exclude build directories from Windows Defender
              if: runner.os == 'Windows'
              run: |
                  Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\out"
                  Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\.tools"
            - name: Install macOS METIS
              if: runner.os == 'macOS'
              # engine/CMakeLists.txt refuses to configure if METIS resolves to vcpkg's static
              # build on macOS (a combination that previously corrupted the live simulation event
              # stream at runtime instead of failing at build time) -- it must come from Homebrew.
              run: brew install metis
            - name: Install Windows Ninja
              if: runner.os == 'Windows'
              # For CMAKE_GENERATOR below. Ninja ships pre-installed on this runner image, so
              # PATH is checked first (via Get-Command) before falling back to a filesystem
              # search or a choco install -- same reasoning as release.yml's equivalent step.
              run: |
                  function Find-ToolDir($exeName) {
                      $onPath = Get-Command $exeName -ErrorAction SilentlyContinue
                      if ($onPath) { return Split-Path $onPath.Source -Parent }
                      $found = Get-ChildItem -Path 'C:\Program Files*', 'C:\ProgramData\chocolatey' -Filter $exeName -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                      if ($found) { return $found.DirectoryName }
                      return $null
                  }
                  $ninjaDir = Find-ToolDir 'ninja.exe'
                  for ($attempt = 1; $attempt -le 3 -and -not $ninjaDir; $attempt++) {
                      choco install ninja -y
                      $ninjaDir = Find-ToolDir 'ninja.exe'
                      if (-not $ninjaDir) {
                          Write-Host "ninja.exe not found after attempt $attempt/3, retrying choco install..."
                          Start-Sleep -Seconds 20
                      }
                  }
                  if (-not $ninjaDir) { Write-Error "ninja.exe not found anywhere after 3 install attempts."; exit 1 }
                  Add-Content -Path $env:GITHUB_PATH -Value $ninjaDir
            - name: Install Linux Electron prerequisites
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libnss3 libasound2t64
            - run: npm ci
            - run: npm run setup
              env:
                  CMAKE_GENERATOR: ${{ runner.os == 'Windows' && 'Ninja' || '' }}
            - run: npm test
            - run: npm run test:engine
            - name: Install package engine layout
              run: cmake --install out/engine --config RelWithDebInfo --prefix out/packageResources/engine
            - run: cmake -E copy thirdPartyNotices.md out/packageResources
            - run: cmake -E copy_directory thirdPartyLicenses out/packageResources/thirdPartyLicenses
            - name: Verify installed METIS runtime and notices
              run: node scripts/verifyPackagingNotices.mjs out/packageResources
            - name: Run Electron interaction tests
              if: runner.os != 'Linux'
              run: npm run test:interaction
            - name: Run Electron interaction tests with a virtual display
              if: runner.os == 'Linux'
              run: xvfb-run -a npm run test:interaction
            - run: npm run build:engine:no-metis
              env:
                  CMAKE_GENERATOR: ${{ runner.os == 'Windows' && 'Ninja' || '' }}
            - name: Test dependency-free partitioner
              working-directory: engine
              run: ctest --preset development-no-metis
