name: Release

# Deliberately not triggered on every push -- only an explicit version tag (or a manual run)
# produces and publishes DMG/EXE/AppImage builds. `crossPlatform.yml` remains the separate,
# cheaper verification workflow; this one's job is packaging and publishing, not testing.
on:
    push:
        tags: ['v*']
    workflow_dispatch:

env:
    VCPKG_DISABLE_METRICS: 1
    # Caches vcpkg's built dependency binaries (boost, protobuf, openssl, metis) in GitHub's own
    # Actions cache instead of rebuilding all of them from source on every run -- by far the
    # biggest cost on Windows specifically, since MSVC compiles noticeably slower than clang/gcc
    # for the same code. The first run after this is added still populates the cache from cold;
    # every run after that should reuse it.
    VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.12.0
                  cache: npm
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.x'
            - uses: ilammy/msvc-dev-cmd@v1
              if: runner.os == 'Windows'
            # Required for VCPKG_BINARY_SOURCES' x-gha provider to authenticate against GitHub's
            # own Actions cache backend -- these two variables aren't populated into the
            # environment by default the way GITHUB_TOKEN is.
            - name: Export GitHub Actions cache environment variables
              uses: actions/github-script@v7
              with:
                  script: |
                      core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
                      core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            - name: Exclude build directories from Windows Defender
              if: runner.os == 'Windows'
              # Real-time scanning of every .obj/.pdb write during compilation is a documented
              # slowdown source for this project (docs/developmentSetup.md); GitHub's Windows
              # runners have Defender active by default.
              run: |
                  Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\out"
                  Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\.tools"
            - name: Install macOS packaging prerequisites
              if: runner.os == 'macOS'
              # metis specifically: engine/CMakeLists.txt refuses to configure if METIS resolves
              # to vcpkg's static build on macOS (a combination that previously corrupted the
              # live simulation event stream at runtime instead of failing at build time) -- it
              # must come from Homebrew, found via its own explicit /opt/homebrew|/usr/local search.
              run: brew install librsvg metis
            - name: Install Windows packaging prerequisites
              if: runner.os == 'Windows'
              # rsvg-convert is the least-certain package name here -- if this step fails on
              # that specifically, that's the first place to look. make is required because this
              # Makefile uses GNU-only syntax (ifeq, pattern rules) that nmake can't parse, and
              # nothing else on this runner puts a GNU make on PATH. choco install itself is
              # retried with real patience (6 attempts, 30s apart) -- Chocolatey's community
              # package feed has been observed to have outages lasting past a short retry window,
              # failing some or all of the packages that actually need installing while reporting
              # a nonzero overall exit code that doesn't say which ones. All three tools are
              # checked individually rather than just the ones a previous failure happened to hit,
              # so a partial success on a later attempt can't be mistaken for a full one.
              run: |
                  function Find-ToolDir($exeName) {
                      $onPath = Get-Command $exeName -ErrorAction SilentlyContinue
                      if ($onPath) { return Split-Path $onPath.Source -Parent }
                      $found = Get-ChildItem -Path 'C:\Program Files*', 'C:\ProgramData\chocolatey' -Filter $exeName -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                      if ($found) { return $found.DirectoryName }
                      return $null
                  }
                  $tools = @{}
                  for ($attempt = 1; $attempt -le 6; $attempt++) {
                      choco install rsvg-convert nsis make -y
                      $tools = @{
                          'rsvg-convert.exe' = Find-ToolDir 'rsvg-convert.exe'
                          'makensis.exe' = Find-ToolDir 'makensis.exe'
                          'make.exe' = Find-ToolDir 'make.exe'
                      }
                      $missing = $tools.GetEnumerator() | Where-Object { -not $_.Value } | ForEach-Object { $_.Key }
                      if (-not $missing) { break }
                      Write-Host "Still missing after attempt $attempt/6: $($missing -join ', '); retrying choco install..."
                      Start-Sleep -Seconds 30
                  }
                  $stillMissing = $tools.GetEnumerator() | Where-Object { -not $_.Value } | ForEach-Object { $_.Key }
                  if ($stillMissing) { Write-Error "Never found: $($stillMissing -join ', ')"; exit 1 }
                  foreach ($tool in $tools.GetEnumerator()) {
                      Write-Host "Found $($tool.Key) at $($tool.Value)"
                      Add-Content -Path $env:GITHUB_PATH -Value $tool.Value
                  }
            - name: Install Linux packaging prerequisites
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y librsvg2-bin
                  curl -L -o /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
                  chmod +x /usr/local/bin/appimagetool
            - run: npm ci
            - name: Build distributable
              # Unsigned for now -- macSignIdentity/appleNotaryProfile are left unset, which the
              # Makefile treats as an intentional opt-out rather than an error.
              #
              # Deliberately NOT using the Ninja generator here despite docs/developmentSetup.md's
              # own speed recommendation: with no generator pinned, the development CMake preset's
              # compiler auto-detection under Ninja picked up this runner's preinstalled MinGW-w64
              # (C:\mingw64) ahead of MSVC's cl.exe, and this codebase is MSVC-only on Windows by
              # design (its pid_t shim collides with MinGW's own). The Visual Studio generator
              # sidesteps this entirely since it's inherently tied to MSVC, no auto-detection
              # involved. Ninja could work here too with CMAKE_C_COMPILER/CMAKE_CXX_COMPILER
              # explicitly pinned to cl, but that's unverified -- revisit deliberately, not blindly.
              run: make distributable
            - uses: actions/upload-artifact@v4
              with:
                  name: release-${{ runner.os }}
                  path: out/release/*
                  if-no-files-found: error

    release:
        needs: build
        # Manual (workflow_dispatch) runs only build and upload artifacts for inspection -- only
        # an actual tag push publishes a GitHub Release.
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: out/release
                  merge-multiple: true
            - uses: softprops/action-gh-release@v2
              with:
                  files: out/release/*
                  generate_release_notes: true
