name: Release

# Deliberately not triggered on every push -- only an explicit version tag (or a manual run)
# produces and publishes DMG/EXE/AppImage builds. `crossPlatform.yml` remains the separate,
# cheaper verification workflow; this one's job is packaging and publishing, not testing.
on:
    push:
        tags: ['v*']
    workflow_dispatch:

env:
    VCPKG_DISABLE_METRICS: 1
    # Caches vcpkg's built dependency binaries (boost, protobuf, openssl, metis) in GitHub's own
    # Actions cache instead of rebuilding all of them from source on every run -- by far the
    # biggest cost on Windows specifically, since MSVC compiles noticeably slower than clang/gcc
    # for the same code. The first run after this is added still populates the cache from cold;
    # every run after that should reuse it.
    VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.12.0
                  cache: npm
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.x'
            - uses: ilammy/msvc-dev-cmd@v1
              if: runner.os == 'Windows'
            # Required for VCPKG_BINARY_SOURCES' x-gha provider to authenticate against GitHub's
            # own Actions cache backend -- these two variables aren't populated into the
            # environment by default the way GITHUB_TOKEN is.
            - name: Export GitHub Actions cache environment variables
              uses: actions/github-script@v7
              with:
                  script: |
                      core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
                      core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            - name: Exclude build directories from Windows Defender
              if: runner.os == 'Windows'
              # Real-time scanning of every .obj/.pdb write during compilation is a documented
              # slowdown source for this project (docs/developmentSetup.md); GitHub's Windows
              # runners have Defender active by default.
              run: |
                  Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\out"
                  Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\.tools"
            - name: Install macOS packaging prerequisites
              if: runner.os == 'macOS'
              # metis specifically: engine/CMakeLists.txt refuses to configure if METIS resolves
              # to vcpkg's static build on macOS (a combination that previously corrupted the
              # live simulation event stream at runtime instead of failing at build time) -- it
              # must come from Homebrew, found via its own explicit /opt/homebrew|/usr/local search.
              run: brew install librsvg metis
            - name: Install Windows packaging prerequisites
              if: runner.os == 'Windows'
              # rsvg-convert is the least-certain package name here -- if this step fails on
              # that specifically, that's the first place to look. make is required because this
              # Makefile uses GNU-only syntax (ifeq, pattern rules) that nmake can't parse, and
              # nothing else on this runner puts a GNU make on PATH. ninja is for CMAKE_GENERATOR
              # below. choco install is retried -- Chocolatey's community package feed has been
              # observed to return a transient 504 on individual packages (seen for nsis
              # specifically), which fails only that one package while the command as a whole
              # keeps going, so it isn't caught by $LASTEXITCODE on the combined install alone.
              # Both makensis.exe and ninja.exe's locations are searched for rather than assumed,
              # since neither's actual install path is reliably its traditional default.
              run: |
                  $installed = $false
                  for ($attempt = 1; $attempt -le 3; $attempt++) {
                      choco install rsvg-convert nsis make ninja -y
                      $makensis = Get-ChildItem -Path 'C:\Program Files*', 'C:\ProgramData\chocolatey' -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                      $ninja = Get-ChildItem -Path 'C:\Program Files*', 'C:\ProgramData\chocolatey' -Filter ninja.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                      if ($makensis -and $ninja) { $installed = $true; break }
                      Write-Host "makensis.exe and/or ninja.exe not found after attempt $attempt/3, retrying choco install..."
                      Start-Sleep -Seconds 20
                  }
                  if (-not $installed) { Write-Error "makensis.exe and/or ninja.exe not found anywhere after 3 install attempts."; exit 1 }
                  Write-Host "Found makensis at $($makensis.DirectoryName)"
                  Add-Content -Path $env:GITHUB_PATH -Value $makensis.DirectoryName
                  Write-Host "Found ninja at $($ninja.DirectoryName)"
                  Add-Content -Path $env:GITHUB_PATH -Value $ninja.DirectoryName
            - name: Install Linux packaging prerequisites
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y librsvg2-bin
                  curl -L -o /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
                  chmod +x /usr/local/bin/appimagetool
            - run: npm ci
            - name: Build distributable
              # Unsigned for now -- macSignIdentity/appleNotaryProfile are left unset, which the
              # Makefile treats as an intentional opt-out rather than an error. CMAKE_GENERATOR is
              # set to Ninja on Windows only -- the development CMake preset doesn't specify a
              # generator, so it otherwise falls back to the slower MSBuild/Visual Studio default
              # there (docs/developmentSetup.md already recommends Ninja for this same reason).
              run: make distributable
              env:
                  CMAKE_GENERATOR: ${{ runner.os == 'Windows' && 'Ninja' || '' }}
            - uses: actions/upload-artifact@v4
              with:
                  name: release-${{ runner.os }}
                  path: out/release/*
                  if-no-files-found: error

    release:
        needs: build
        # Manual (workflow_dispatch) runs only build and upload artifacts for inspection -- only
        # an actual tag push publishes a GitHub Release.
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: out/release
                  merge-multiple: true
            - uses: softprops/action-gh-release@v2
              with:
                  files: out/release/*
                  generate_release_notes: true
