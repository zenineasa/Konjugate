name: Release

# Deliberately not triggered on every push -- only an explicit version tag (or a manual run)
# produces and publishes DMG/EXE/AppImage builds. `crossPlatform.yml` remains the separate,
# cheaper verification workflow; this one's job is packaging and publishing, not testing.
on:
    push:
        tags: ['v*']
    workflow_dispatch:

env:
    VCPKG_DISABLE_METRICS: 1
    # Caches vcpkg's built dependency binaries (boost, protobuf, openssl, metis) in GitHub's own
    # Actions cache instead of rebuilding all of them from source on every run -- by far the
    # biggest cost on Windows specifically, since MSVC compiles noticeably slower than clang/gcc
    # for the same code. The first run after this is added still populates the cache from cold;
    # every run after that should reuse it.
    VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
    MACOSX_DEPLOYMENT_TARGET: '11.0'

jobs:
    verifyAppMetainfo:
        # Fails fast and cheaply, before the expensive 4-OS native build matrix below even starts,
        # if packaging/linux/com.konjugate.Konjugate.metainfo.xml wasn't regenerated after a change
        # to packaging/appMetadata.yml or package.json's version -- see
        # docs/packageManagerDistribution.md's "Shared app metadata" section and
        # scripts/generateAppMetainfo.mjs's own comment for why this file is generated rather than
        # hand-edited. Installs just js-yaml rather than the full `npm ci` the build job below does --
        # nothing else this generator touches is a real dependency of it.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24.19.0
            - run: npm install --no-save js-yaml
            - run: npm run generate:app-metainfo
            - name: Fail if the committed file doesn't match what the generator produces
              run: |
                  if ! git diff --exit-code packaging/linux/com.konjugate.Konjugate.metainfo.xml; then
                      echo "::error::packaging/linux/com.konjugate.Konjugate.metainfo.xml is out of date -- run 'npm run generate:app-metainfo' and commit the result."
                      exit 1
                  fi

    build:
        needs: verifyAppMetainfo
        strategy:
            fail-fast: false
            # macos-latest is Apple Silicon (arm64) only; macos-15-intel adds an x86_64 build
            # alongside it. GitHub has only committed to macos-15-intel through around August
            # 2027, after which x86_64 macOS runners go away entirely -- this will need revisiting
            # (or dropping) before then. The Makefile already auto-detects architecture correctly
            # on either runner, so no other build-side change is needed for this to work.
            #
            # Linux is pinned to ubuntu-22.04 rather than ubuntu-latest on purpose: the AppImage
            # isn't self-contained (the engine links the system's glibc/libstdc++), so it only
            # runs on distributions at least as new as the one it was built on. The AppImage
            # catalog's test flagged the ubuntu-latest (24.04, glibc 2.38+) build as too new;
            # the convention is to build on the oldest still-supported Ubuntu LTS. Move this
            # forward only when that release leaves standard support (22.04: April 2027).
            matrix:
                os: [macos-latest, macos-15-intel, ubuntu-22.04, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24.19.0
                  cache: npm
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.x'
            - uses: ilammy/msvc-dev-cmd@v1
              if: runner.os == 'Windows'
            # Required for VCPKG_BINARY_SOURCES' x-gha provider to authenticate against GitHub's
            # own Actions cache backend -- these two variables aren't populated into the
            # environment by default the way GITHUB_TOKEN is.
            - name: Export GitHub Actions cache environment variables
              uses: actions/github-script@v7
              with:
                  script: |
                      core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
                      core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            - name: Exclude build directories from Windows Defender
              if: runner.os == 'Windows'
              # Real-time scanning of every .obj/.pdb write during compilation is a documented
              # slowdown source for this project (docs/developmentSetup.md); GitHub's Windows
              # runners have Defender active by default.
              run: |
                  Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\out"
                  Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\.tools"
            - name: Install macOS packaging prerequisites
              if: runner.os == 'macOS'
              # metis specifically: engine/CMakeLists.txt refuses to configure if METIS resolves
              # to vcpkg's static build on macOS (a combination that previously corrupted the
              # live simulation event stream at runtime instead of failing at build time) -- it
              # must come from Homebrew, found via its own explicit /opt/homebrew|/usr/local search.
              run: brew install librsvg metis create-dmg
            - name: Install Windows packaging prerequisites
              if: runner.os == 'Windows'
              # rsvg-convert is the least-certain package name here -- if this step fails on
              # that specifically, that's the first place to look. make is required because this
              # Makefile uses GNU-only syntax (ifeq, pattern rules) that nmake can't parse, and
              # nothing else on this runner puts a GNU make on PATH. choco install itself is
              # retried with real patience (6 attempts, 30s apart) -- Chocolatey's community
              # package feed has been observed to have outages lasting past a short retry window,
              # failing some or all of the packages that actually need installing while reporting
              # a nonzero overall exit code that doesn't say which ones. All three tools are
              # checked individually rather than just the ones a previous failure happened to hit,
              # so a partial success on a later attempt can't be mistaken for a full one.
              run: |
                  function Find-ToolDir($exeName) {
                      $onPath = Get-Command $exeName -ErrorAction SilentlyContinue
                      if ($onPath) { return Split-Path $onPath.Source -Parent }
                      $found = Get-ChildItem -Path 'C:\Program Files*', 'C:\ProgramData\chocolatey' -Filter $exeName -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                      if ($found) { return $found.DirectoryName }
                      return $null
                  }
                  $tools = @{}
                  for ($attempt = 1; $attempt -le 6; $attempt++) {
                      choco install rsvg-convert nsis make -y
                      $tools = @{
                          'rsvg-convert.exe' = Find-ToolDir 'rsvg-convert.exe'
                          'makensis.exe' = Find-ToolDir 'makensis.exe'
                          'make.exe' = Find-ToolDir 'make.exe'
                      }
                      $missing = $tools.GetEnumerator() | Where-Object { -not $_.Value } | ForEach-Object { $_.Key }
                      if (-not $missing) { break }
                      Write-Host "Still missing after attempt $attempt/6: $($missing -join ', '); retrying choco install..."
                      Start-Sleep -Seconds 30
                  }
                  $stillMissing = $tools.GetEnumerator() | Where-Object { -not $_.Value } | ForEach-Object { $_.Key }
                  if ($stillMissing) { Write-Error "Never found: $($stillMissing -join ', ')"; exit 1 }
                  foreach ($tool in $tools.GetEnumerator()) {
                      Write-Host "Found $($tool.Key) at $($tool.Value)"
                      Add-Content -Path $env:GITHUB_PATH -Value $tool.Value
                  }
            - name: Install Linux packaging prerequisites
              if: runner.os == 'Linux'
              # zsync provides zsyncmake, which appimagetool needs to write the .zsync file that
              # goes with the update information the Makefile embeds (without it, appimagetool
              # only warns and skips the file -- the Makefile then fails the build).
              run: |
                  sudo apt-get update
                  sudo apt-get install -y librsvg2-bin zsync
                  curl -L -o /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
                  chmod +x /usr/local/bin/appimagetool
            - run: npm ci
            - name: Build distributable
              # Unsigned for now -- macSignIdentity/appleNotaryProfile are left unset, which the
              # Makefile treats as an intentional opt-out rather than an error.
              #
              # Deliberately NOT using the Ninja generator here despite docs/developmentSetup.md's
              # own speed recommendation: with no generator pinned, the development CMake preset's
              # compiler auto-detection under Ninja picked up this runner's preinstalled MinGW-w64
              # (C:\mingw64) ahead of MSVC's cl.exe, and this codebase is MSVC-only on Windows by
              # design (its pid_t shim collides with MinGW's own). The Visual Studio generator
              # sidesteps this entirely since it's inherently tied to MSVC, no auto-detection
              # involved. Ninja could work here too with CMAKE_C_COMPILER/CMAKE_CXX_COMPILER
              # explicitly pinned to cl, but that's unverified -- revisit deliberately, not blindly.
              #
              # APPIMAGE_EXTRACT_AND_RUN only matters on Linux: appimagetool is itself an AppImage,
              # and this makes it unpack itself instead of depending on the runner having FUSE.
              env:
                  APPIMAGE_EXTRACT_AND_RUN: 1
              run: make distributable
            - name: Verify Windows installer's silent-install path
              if: runner.os == 'Windows'
              # installer.nsi has never had its /S (unattended) path actually exercised -- reading
              # the script only confirms it has no custom UI logic that ought to block under /S,
              # not that it actually works. This matters beyond CI hygiene: winget's own installer
              # runner relies on this same flag, so a broken silent path would make every winget
              # install hang, not just this check. RequestExecutionLevel admin still applies (the
              # OS-level UAC prompt isn't something /S can suppress), but GitHub's Windows runners
              # execute steps with an already-elevated account, so no interactive prompt blocks this.
              run: |
                  $installer = Get-ChildItem out\release\*-setup.exe | Select-Object -First 1
                  if (-not $installer) { Write-Error "No -setup.exe found under out\release."; exit 1 }
                  $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru
                  $process.WaitForExit(120000) | Out-Null
                  if (-not $process.HasExited) { Write-Error "Silent install did not finish within 120s -- it may be blocked on an unexpected prompt."; exit 1 }
                  if ($process.ExitCode -ne 0) { Write-Error "Silent install exited with code $($process.ExitCode)."; exit 1 }
                  $installDir = (Get-ItemProperty -Path 'HKLM:\Software\com.konjugate' -Name InstallDir -ErrorAction Stop).InstallDir
                  if (-not (Test-Path (Join-Path $installDir 'Konjugate.exe'))) { Write-Error "Konjugate.exe was not found under the recorded InstallDir after a silent install."; exit 1 }
                  Write-Host "Silent install verified at $installDir"
                  $uninstaller = Join-Path $installDir 'Uninstall.exe'
                  Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait
            - name: Verify packaged engine
              run: make verifyPackagedEngine
            - name: Build Microsoft Store MSIX
              # Opt-in by the MSIX_IDENTITY_NAME repository variable (Settings -> Secrets and
              # variables -> Actions -> Variables), which also needs MSIX_PUBLISHER and
              # MSIX_PUBLISHER_DISPLAY_NAME -- the identity Partner Center assigns to the reserved
              # app name. Unsigned on purpose: the Store signs it on ingestion. Reuses the packaged
              # app folder `make distributable` just built, so this adds seconds, not a rebuild.
              # Deliberately written to out/msix, not out/release, and uploaded under a name that
              # does not match release-* so it never reaches the GitHub Release.
              if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && vars.MSIX_IDENTITY_NAME != ''
              env:
                  MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
                  MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
                  MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
              run: node scripts/createMsixPackage.mjs out/package/Konjugate-win32-x64 out/msix/Konjugate-x64.msix x64
            - uses: actions/upload-artifact@v4
              if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && vars.MSIX_IDENTITY_NAME != ''
              with:
                  name: msix-Windows-X64
                  path: out/msix/Konjugate-x64.msix
                  if-no-files-found: error
            - uses: actions/upload-artifact@v4
              with:
                  # runner.arch disambiguates the two macOS runners (macos-latest and
                  # macos-15-intel both report runner.os == 'macOS') -- without it, their
                  # artifact uploads would collide on the same name and the second would fail.
                  name: release-${{ runner.os }}-${{ runner.arch }}
                  path: out/release/*
                  if-no-files-found: error

    release:
        needs: build
        # Manual (workflow_dispatch) runs only build and upload artifacts for inspection -- only
        # an actual tag push publishes a GitHub Release.
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: out/release
                  # Only the installers: without a filter this would also download the unsigned
                  # MSIX artifact below, and the step that publishes out/release/* would attach it
                  # to the GitHub Release.
                  pattern: release-*
                  merge-multiple: true
            - name: Compose release notes
              env:
                  GH_TOKEN: ${{ github.token }}
                  repository: ${{ github.repository }}
                  tag: ${{ github.ref_name }}
              run: |
                  assetLink() {
                      local matches=(out/release/$1)
                      if [ ! -f "${matches[0]}" ]; then echo "No release asset matches $1." >&2; exit 1; fi
                      local file="${matches[0]##*/}"
                      echo "- $2: [$file](https://github.com/$repository/releases/download/$tag/$file)"
                  }
                  {
                      cat <<'EOF'
                  > **Installation notes:** Konjugate isn't code-signed yet (an active choice while the project is in beta), so your OS may show a security warning on first launch. This doesn't mean the download is corrupted.
                  >
                  > - **macOS**: install with [Homebrew](https://brew.sh), the recommended way: `brew install --cask zenineasa/konjugate/konjugate` (it checks the download, puts Konjugate in Applications and opens without a warning; update with `brew upgrade --cask konjugate`). Downloaded the DMG below instead? If you see "is damaged and can't be opened": move Konjugate.app to Applications, then in Terminal run `xattr -cr /Applications/Konjugate.app`. Or: System Settings → Privacy & Security → Open Anyway.
                  > - **Windows** — if you see a blue "Windows protected your PC" warning from SmartScreen, click **More info**, then click the **Run anyway** button that appears.

                  EOF
                      gh api "repos/$repository/releases/generate-notes" -f tag_name="$tag" --jq .body
                      echo
                      echo "## Downloads"
                      echo
                      assetLink '*.AppImage' 'Linux'
                      assetLink '*-setup.exe' 'Windows'
                      assetLink '*-arm64.dmg' 'macOS (Apple silicon)'
                      assetLink '*-x64.dmg' 'macOS (Intel)'
                  } > "$RUNNER_TEMP/releaseNotes.md"
                  cat "$RUNNER_TEMP/releaseNotes.md"
            - uses: softprops/action-gh-release@v2
              with:
                  files: out/release/*
                  body_path: ${{ runner.temp }}/releaseNotes.md

    # Package-manager publish jobs. Each one is opt-in by secret: with the secret unset, the job
    # still runs but its real step is skipped with a notice, so a release never goes red just
    # because a channel hasn't been set up. See docs/packageManagerDistribution.md for the one-time
    # manual setup each channel needs before its secret is added.
    #
    # The official Homebrew Cask and Snap remain deliberately deferred, with no job here (Konjugate's
    # own Homebrew tap is automated by homebrewTapRelease below):
    #   - official Homebrew Cask: a real `brew audit --new` run surfaced hard blockers (macOS
    #     notarization, a project-notability bar) that aren't quick fixes.
    #   - Snap: needs a one-time Snapcraft Store credential (SNAPCRAFT_STORE_CREDENTIALS) that
    #     doesn't exist yet, and distribution/snap/snapcraft.yaml itself has never been run through
    #     a real `snapcraft pack`.
    # Re-add a job for either (see this file's git history, commit c40e5ee, for the exact
    # configuration) once its blocker is cleared.

    wingetRelease:
        needs: release
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        env:
            WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        steps:
            # winget-releaser only BUMPS an existing package -- its own action.yml checks that the
            # PackageIdentifier already exists in microsoft/winget-pkgs and errors out if not. So
            # WINGET_TOKEN must only be added after the first, manually submitted manifest has been
            # merged upstream.
            - name: Skip when winget isn't set up yet
              if: env.WINGET_TOKEN == ''
              run: echo "::notice::WINGET_TOKEN is not set; skipping winget (see docs/packageManagerDistribution.md)."
            - uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
              if: env.WINGET_TOKEN != ''
              with:
                  identifier: Konjugate.Konjugate
                  installers-regex: '-setup\.exe$'
                  token: ${{ secrets.WINGET_TOKEN }}

    chocolateyRelease:
        needs: release
        if: startsWith(github.ref, 'refs/tags/v')
        # Windows because `choco` is preinstalled there and `choco pack` is Windows-only.
        runs-on: windows-latest
        env:
            CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        steps:
            - name: Skip when Chocolatey isn't set up yet
              if: env.CHOCOLATEY_API_KEY == ''
              run: echo "::notice::CHOCOLATEY_API_KEY is not set; skipping Chocolatey (see docs/packageManagerDistribution.md)."
            - uses: actions/checkout@v4
              if: env.CHOCOLATEY_API_KEY != ''
            - uses: actions/setup-node@v4
              if: env.CHOCOLATEY_API_KEY != ''
              with:
                  node-version: 24.19.0
            - name: Build and push the Chocolatey package
              if: env.CHOCOLATEY_API_KEY != ''
              shell: pwsh
              # The generator downloads the just-published release asset and hashes it, so the
              # pushed package is verified against exactly what users get. A successful push only
              # means the package entered Chocolatey's moderation queue, not that it's live.
              run: |
                  npm install --no-save js-yaml
                  node scripts/generateChocolateyPackage.mjs "${{ github.ref_name }}"
                  choco pack out/chocolatey/konjugate.nuspec --outputdirectory out/chocolatey
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  $nupkg = Get-ChildItem out/chocolatey/konjugate.*.nupkg | Select-Object -First 1
                  choco push $nupkg.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    microsoftStoreRelease:
        needs: release
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: windows-latest
        env:
            MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
        steps:
            # Updates an EXISTING Store listing -- the first submission is made by hand in Partner
            # Center (listing, privacy policy, age rating, runFullTrust justification), and the
            # Azure AD app has to be linked to the Partner Center account. Needs the
            # MSIX_IDENTITY_NAME/MSIX_PUBLISHER variables too, since the build job only produces the
            # MSIX when they are set. See docs/packageManagerDistribution.md.
            - name: Skip when the Microsoft Store isn't set up yet
              if: env.MS_STORE_CLIENT_SECRET == ''
              run: echo "::notice::MS_STORE_CLIENT_SECRET is not set; skipping the Microsoft Store (see docs/packageManagerDistribution.md)."
            - uses: actions/download-artifact@v4
              if: env.MS_STORE_CLIENT_SECRET != ''
              with:
                  name: msix-Windows-X64
                  path: out/msix
            - uses: microsoft/setup-msstore-cli@v1
              if: env.MS_STORE_CLIENT_SECRET != ''
            - name: Submit the MSIX to the Microsoft Store
              if: env.MS_STORE_CLIENT_SECRET != ''
              shell: pwsh
              # A successful publish only means the submission entered Microsoft's certification
              # review (a few days), not that it is live. The msstore flags below are from its
              # documentation, not yet exercised against a real submission -- if the first run
              # rejects one, `msstore publish --help` is the place to check.
              env:
                  MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
                  MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
                  MS_STORE_SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
                  MS_STORE_PRODUCT_ID: ${{ secrets.MS_STORE_PRODUCT_ID }}
              run: |
                  msstore reconfigure --tenantId $env:MS_STORE_TENANT_ID --sellerId $env:MS_STORE_SELLER_ID --clientId $env:MS_STORE_CLIENT_ID --clientSecret $env:MS_STORE_CLIENT_SECRET
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  msstore publish out/msix/Konjugate-x64.msix --appId $env:MS_STORE_PRODUCT_ID
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    homebrewTapRelease:
        needs: release
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        env:
            HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        steps:
            # Keeps the cask in Konjugate's own tap (zenineasa/homebrew-konjugate) pointed at the
            # release just published, so `brew upgrade --cask konjugate` finds it. Opt-in by secret
            # like the other channels: HOMEBREW_TAP_TOKEN is a token with write access to the tap
            # repository's contents (see docs/packageManagerDistribution.md for the setup). The tap
            # repository has to exist already; this only updates its Casks/konjugate.rb.
            - name: Skip when the Homebrew tap isn't set up yet
              if: env.HOMEBREW_TAP_TOKEN == ''
              run: echo "::notice::HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew tap (see docs/packageManagerDistribution.md)."
            - uses: actions/checkout@v4
              if: env.HOMEBREW_TAP_TOKEN != ''
            - uses: actions/setup-node@v4
              if: env.HOMEBREW_TAP_TOKEN != ''
              with:
                  node-version: 24.19.0
            - uses: actions/checkout@v4
              if: env.HOMEBREW_TAP_TOKEN != ''
              with:
                  repository: zenineasa/homebrew-konjugate
                  token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
                  path: tap
            - name: Update the tap's cask for this release
              if: env.HOMEBREW_TAP_TOKEN != ''
              env:
                  TAG: ${{ github.ref_name }}
              # The generator downloads the just-published DMGs and AppImage and hashes them, so the
              # cask's checksums are those of exactly what users download.
              run: |
                  node scripts/generateHomebrewCask.mjs "$TAG" --tap
                  mkdir -p tap/Casks
                  cp distribution/homebrew/tap/Casks/konjugate.rb tap/Casks/konjugate.rb
                  cd tap
                  git add Casks/konjugate.rb
                  if git diff --cached --quiet; then
                      echo "The tap's cask is already up to date."
                      exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git commit -m "konjugate $TAG"
                  git push
