name: Web edition build

# A version-tag push (release.yml's own "version change" trigger for the desktop build/release)
# now also deploys the web edition -- matching that file's own build-vs-publish split exactly: a
# manual workflow_dispatch run still only builds and uploads artifacts for inspection (the `deploy`
# job below is gated on `startsWith(github.ref, 'refs/tags/v')`, same condition release.yml's own
# `release` job uses), so nothing publishes without an actual version tag. This deploys the
# default, non-threads `web`/`webShell` build only, per docs/proposals/webEdition.md's own hosting
# decision -- GitHub Pages for that variant, a COOP/COEP-capable host (Netlify/Cloudflare Pages)
# for the pthread-enabled `web-threads`/`webShellThreads` variant specifically, since GitHub Pages
# cannot send the response headers SharedArrayBuffer needs. That second host is real, separate
# infrastructure (its own account/credentials) not set up here.
#
# One remaining manual step this file cannot do on its own: GitHub Pages must be enabled under
# this repository's Settings > Pages, with "GitHub Actions" selected as the source. The `deploy`
# job below will fail with a clear permissions/environment error until that's done once.
on:
    push:
        tags: ['v*']
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            VCPKG_DISABLE_METRICS: 1
            # Caches vcpkg's built dependency binaries in GitHub's own Actions cache instead of
            # rebuilding all of them (including the wasm32-emscripten triplet's own set) from
            # source on every run -- see crossPlatform.yml/release.yml for the same.
            VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24.19.0
                  cache: npm
            - name: Export GitHub Actions cache environment variables
              uses: actions/github-script@v7
              with:
                  script: |
                      core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
                      core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            - run: npm ci
            - run: npm run setup:web
            - run: npm run build:web
            - run: npm run build:webShell
            - name: Upload the built shell for inspection
              uses: actions/upload-artifact@v4
              with:
                  name: webShell
                  path: out/webShell
                  if-no-files-found: error
            # Packages the exact same output in the shape actions/deploy-pages@v4 expects.
            - name: Package as a Pages-deployable artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: out/webShell

    deploy:
        needs: build
        # Manual (workflow_dispatch) runs only build and upload artifacts for inspection -- only
        # an actual version-tag push deploys, matching release.yml's own `release` job condition.
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
