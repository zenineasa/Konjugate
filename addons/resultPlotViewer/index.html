<!doctype html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <!-- style-src needs 'unsafe-inline': Plotly injects its own base stylesheet (position:absolute
         on each SVG layer, among other rules) into <head> at runtime -- without it, that stylesheet
         is silently blocked, and its layered SVGs fall back to normal document flow instead of
         overlaying, visibly displacing content like the legend. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
    <title>Results Analysis</title>
    <link rel="stylesheet" href="styles.css">
    <script src="../../node_modules/plotly.js-dist-min/plotly.min.js"></script>
    <script type="module" src="viewer.mjs"></script>
</head>
<body>
    <header class="analysisHeader">
        <div class="runIdentity"><strong id="projectName">—</strong><span id="runName">—</span></div>
        <div class="liveControls"><span id="runLifecycle" class="readOnlyBadge">Completed</span><select id="pacing" aria-label="Simulation pacing" hidden><option value="fastest">Fastest</option><option value="limitedRatio:0.5">0.5× real time</option><option value="realTime">Real time</option><option value="limitedRatio:2">2× real time</option><option value="limitedRatio:10">10× real time</option></select></div>
    </header>
    <main>
        <aside class="signalBrowser">
            <header><div><span>Signals</span><strong>Compare results</strong></div><button id="clearSignals" type="button">Clear</button></header>
            <label class="chartModeField"><span>Chart</span><select id="chartMode" aria-label="Chart type">
                <option value="timeSeries" selected>Time series</option>
                <option value="scatter">Scatter</option>
                <option value="distribution">Distribution</option>
            </select></label>
            <button id="resetTrail" type="button" hidden>Reset trail</button>
            <div id="scatterPickers" class="scatterPickers" hidden>
                <label><span>X axis</span><select id="scatterX" aria-label="Scatter X axis signal"></select></label>
                <label><span>Y axis</span><select id="scatterY" aria-label="Scatter Y axis signal"></select></label>
                <label><span>Color by</span><select id="scatterColor" aria-label="Scatter color-by signal"><option value="">None</option></select></label>
                <label><span>Size by</span><select id="scatterSize" aria-label="Scatter size-by signal"><option value="">None</option></select></label>
            </div>
            <input id="signalSearch" type="search" placeholder="Search nodes or signals" aria-label="Search signals">
            <div id="signalGroups"></div>
            <button id="exportCsv" type="button" disabled>Export data (CSV)</button>
        </aside>
        <section class="plotWorkspace">
            <div id="analysisPlot" role="img" aria-label="Selected simulation signals"></div>
            <div id="emptyPlot"><strong>Select signals to compare</strong><span>Signals may use different units and domains.</span></div>
        </section>
    </main>
    <footer class="analysisTimeline">
        <output id="currentTime">0 s</output>
        <input id="timeline" type="range" min="0" max="0" value="0" step="any" aria-label="Simulation time">
        <output id="targetTime">0 s</output>
    </footer>
</body>
</html>
