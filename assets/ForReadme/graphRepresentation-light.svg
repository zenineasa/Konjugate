<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img">
<title>A system as a graph of states and interactions</title>
<desc>Five nodes x1 to x5 joined by directed interactions; an arrow from node j to node i carries f_ij, and each node has a local term s_i. Each node evolves as the sum of the interactions arriving at it plus its local term.</desc>
