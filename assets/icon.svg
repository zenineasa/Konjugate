<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 256 256"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Konjugate icon</title>
  <desc id="description">
    A network of four connected state nodes arranged into the letter K.
  </desc>

  <defs>
    <linearGradient id="background" x1="32" y1="20" x2="224" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10233f"/>
      <stop offset="1" stop-color="#08111f"/>
    </linearGradient>
    <linearGradient id="connection" x1="61" y1="48" x2="195" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#64e6d3"/>
      <stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
    <radialGradient id="hub" cx="0" cy="0" r="1" gradientTransform="translate(69 120) rotate(42) scale(35)">
      <stop offset="0" stop-color="#c7fff7"/>
      <stop offset="0.45" stop-color="#64e6d3"/>
      <stop offset="1" stop-color="#27aaad"/>
    </radialGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#background)"/>
  <path
    d="M69 56V200M69 128H113C133 128 143 116 153 100L181 56M113 128C133 128 143 140 153 156L181 200"
    fill="none"
    stroke="#183d5c"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M69 56V200M69 128H113C133 128 143 116 153 100L181 56M113 128C133 128 143 140 153 156L181 200"
    fill="none"
    stroke="url(#connection)"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <g filter="url(#glow)">
    <circle cx="69" cy="56" r="13" fill="#64e6d3" stroke="#d9fff9" stroke-width="4"/>
    <circle cx="69" cy="128" r="18" fill="url(#hub)" stroke="#e1fffb" stroke-width="5"/>
    <circle cx="69" cy="200" r="13" fill="#4fc9de" stroke="#d9faff" stroke-width="4"/>
    <circle cx="181" cy="56" r="13" fill="#5ca9f8" stroke="#e0efff" stroke-width="4"/>
    <circle cx="181" cy="200" r="13" fill="#4f8cff" stroke="#e0eaff" stroke-width="4"/>
  </g>
</svg>
