edition = "2024";

package konjugate.protocol;

message Capabilities {
    bool metis_available = 1;
    string metis_version = 2;
    // Every optimizer backend id runParameterFit()/createOptimizerBackend() (parameterFitting.cpp)
    // will accept in this build -- the UI's backend picker can populate itself from this rather
    // than hardcoding a list.
    repeated string optimizer_backend_ids = 3;
}

message StateDescriptor {
    uint64 state_id = 1;
}

message StateTable {
    repeated StateDescriptor states = 1;
}

message SampleBatch {
    repeated double times = 1;
    uint32 state_count = 2;
    repeated double values = 3;
}

enum PacingMode {
    PACING_MODE_UNSPECIFIED = 0;
    PACING_MODE_FASTEST = 1;
    PACING_MODE_REAL_TIME = 2;
    PACING_MODE_LIMITED_RATIO = 3;
}

enum RunState {
    RUN_STATE_UNSPECIFIED = 0;
    RUN_STATE_RUNNING = 1;
    RUN_STATE_PAUSED = 2;
    RUN_STATE_STOPPED = 3;
}

message SetPacing {
    PacingMode mode = 1;
    double simulation_seconds_per_wall_second = 2;
}

message SetRunState {
    RunState state = 1;
}

message SetParameterValue {
    uint64 parameter_id = 1;
    double value = 2;
}

message EngineCommand {
    uint32 protocol_version = 1;
    uint64 sequence = 2;
    oneof payload {
        SetPacing set_pacing = 3;
        SetRunState set_run_state = 4;
        SetParameterValue set_parameter_value = 5;
    }
}

message NodeProviderCheckpoint {
    uint64 node_id = 1;
    bytes payload = 2;
}

message ResultCheckpoint {
    string uuid = 1;
    double time = 2;
    repeated double values = 3;
    string solver_kind = 4;
    uint32 solver_version = 5;
    repeated NodeProviderCheckpoint provider_states = 6;
}

message ResultFile {
    uint32 result_version = 1;
    bytes metadata_json = 2;
    StateTable state_table = 3;
    reserved 4;
    repeated ResultCheckpoint checkpoints = 5;
}

message ResultBatchIndex {
    double start_time = 1;
    double end_time = 2;
    uint64 offset = 3;
    uint32 length = 4;
    uint32 sample_count = 5;
}

message ResultIndex {
    uint32 result_version = 1;
    uint64 sample_count = 2;
    repeated ResultBatchIndex batches = 3;
}

message EngineEvent {
    uint32 protocol_version = 1;
    oneof payload {
        Capabilities capabilities = 2;
        StateTable state_table = 3;
        SampleBatch sample_batch = 4;
    }
}

// One-shot report messages, written once by a CLI subcommand (validate/infer/fit/inspect) and
// read back once on the JS side -- see engine/src/*Report.cpp and src/reportProtocol.mjs. Unlike
// the streaming messages above, these were previously hand-written JSON via raw std::ostringstream
// string concatenation, which is how a diverging fit's non-finite loss (double values C++'s
// default ostream formatting prints as the literal words "inf"/"nan", neither a valid JSON token)
// ended up producing a report JSON.parse() rejected outright. protobuf's double fields natively
// represent Infinity/-Infinity/NaN, so that failure mode doesn't exist here.

message IssueLocationReport {
    string kind = 1;
    string entity_id = 2;
    string field = 3;
}

message ValidationIssueReport {
    string code = 1;
    string severity = 2;
    string message = 3;
    IssueLocationReport location = 4;
}

message ValidationSummary {
    uint64 nodes = 1;
    uint64 edges = 2;
}

message ValidationReport {
    uint32 report_version = 1;
    string engine_version = 2;
    bool valid = 3;
    ValidationSummary summary = 4;
    repeated ValidationIssueReport issues = 5;
}

message InspectionReport {
    uint32 report_version = 1;
    string format = 2;
    uint32 container_version = 3;
    bool encrypted = 4;
}

message PolynomialTermReport {
    int32 degree = 1;
    double coefficient = 2;
}

message InteractionTermReport {
    double coefficient = 1;
}

message InferredEdgeReport {
    string source_column = 1;
    string target_column = 2;
    int32 lag = 3;
    repeated PolynomialTermReport terms = 4;
    InteractionTermReport interaction = 5; // absent unless fit and accepted -- message fields are inherently presence-tracked
    double intercept = 6;
    double score = 7;
    string provenance = 8;
}

message SelfTermReport {
    string target_column = 1;
    double rate = 2;
}

message InferenceReport {
    uint32 report_version = 1;
    string engine_version = 2;
    repeated InferredEdgeReport edges = 3;
    repeated SelfTermReport self_terms = 4;
}

message FittingProgressUpdateReport {
    uint64 iteration = 1;
    double loss = 2;
    repeated double parameter_values = 3;
}

message FittedParameterReport {
    uint64 parameter_id = 1;
    double value = 2;
}

message FittingReport {
    uint32 report_version = 1;
    string engine_version = 2;
    string backend = 3;
    bool converged = 4;
    string termination_reason = 5;
    double final_loss = 6;
    repeated FittingProgressUpdateReport iterations = 7;
    repeated FittedParameterReport final_parameters = 8;
}
