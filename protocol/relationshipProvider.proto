edition = "2024";

package konjugate.provider.protocol;

enum RuntimeKind {
    RUNTIME_KIND_UNSPECIFIED = 0;
    RUNTIME_KIND_CPP = 1;
    RUNTIME_KIND_PYTHON = 2;
}

message HandshakeRequest {
    uint32 protocol_version = 1;
    uint32 provider_api_version = 2;
}

message HandshakeResponse {
    uint32 protocol_version = 1;
    uint32 provider_api_version = 2;
    RuntimeKind runtime = 3;
    string provider_id = 4;
    repeated string input_keys = 5;
    string output_key = 6;
    bool supports_node_provider = 7;
    repeated string output_keys = 8;
    // Version 2 (docs/proposals/programSdkV2.md): the program's whole description -- its ports with kind, unit and default, its outputs'
    // declared dependencies, its memory fields, its clock -- as JSON in exactly the in-process ABI's shape
    // (KonjugateInProcessProgramV2::description), so both transports are read by one parser. Absent from a version 1 worker's answer.
    string program_description = 9;
}

message ProviderInstance {
    uint64 instance_id = 1;
    repeated string input_keys = 2;
}

message InitializeRequest {
    repeated ProviderInstance instances = 1;
}

message InitializeResponse {
    repeated uint64 initialized_instance_ids = 1;
}

message Evaluation {
    uint64 instance_id = 1;
    repeated double inputs = 2;
}

message EvaluateBatchRequest {
    uint64 sequence = 1;
    double simulation_time = 2;
    double step_size = 3;
    repeated Evaluation evaluations = 4;
}

message GradientContribution {
    uint64 instance_id = 1;
    double value = 2;
}

message EvaluateBatchResponse {
    uint64 sequence = 1;
    repeated GradientContribution contributions = 2;
}

message ShutdownRequest {}
message ShutdownResponse {}

message NodeOutput {
    string key = 1;
    double value = 2;
}

message NodeEvaluation {
    uint64 instance_id = 1;
    repeated double inputs = 2;
}

message NodeEvaluateRequest {
    uint64 sequence = 1;
    double simulation_time = 2;
    double step_size = 3;
    repeated NodeEvaluation evaluations = 4;
}

message NodeGradientContribution {
    uint64 instance_id = 1;
    repeated NodeOutput outputs = 2;
}

message NodeEvaluateResponse {
    uint64 sequence = 1;
    repeated NodeGradientContribution contributions = 2;
}

message CheckpointRequest {
    uint64 instance_id = 1;
}

message CheckpointResponse {
    uint64 instance_id = 1;
    bytes payload = 2;
}

message RestoreRequest {
    uint64 instance_id = 1;
    bytes payload = 2;
}

message RestoreResponse {
    uint64 instance_id = 1;
    bool restored = 2;
}

// ── Version 2 (konjugate.v2, docs/proposals/programSdkV2.md) ────────────────────────────────────────────────────────────────────────
// One object per instance. Every input crosses in the program's declaration order, already defaulted and converted to the program's
// units by the engine. The worker keeps each instance's memory and returns it whole after initialize and every advance, so the engine's
// copy is always exact; a restore sends it back. An outcome's status: 0 done, 1 failed (message, line), 2 out of domain (the program
// refused these inputs: an adaptive method rejects the step), 3 not provided (no Jacobian).

message ProgramInstance {
    uint64 instance_id = 1;
    string owner = 2;            // "node Heater", for the program's messages
    double start_time = 3;
    repeated double values = 4;  // every input at the start: initialize() reads the constants among them
    bytes bound = 5;             // one byte per input: 0 for an optional input left unbound
    uint64 owner_id = 6;         // the id of the node, relationship or term: a Random stream's seed
    uint64 program_seed = 7;     // the program's optional seed
}

message ProgramInitializeRequest {
    repeated ProgramInstance instances = 1;
}

message ProgramCall {
    uint64 instance_id = 1;
    repeated double values = 2;
    bool first = 3;              // advance: the first of the run
}

message ProgramEvaluateRequest {
    double time = 1;
    repeated ProgramCall calls = 2;
}

message ProgramAdvanceRequest {
    double time = 1;
    double size = 2;
    repeated ProgramCall calls = 3;
}

message ProgramJacobianRequest {
    double time = 1;
    repeated ProgramCall calls = 2;
}

message ProgramMemory {
    uint64 instance_id = 1;
    bytes memory = 2;
}

message ProgramSetMemoryRequest {
    repeated ProgramMemory memories = 1;
}

message ProgramOutcome {
    uint64 instance_id = 1;
    repeated double values = 2;  // evaluate: the outputs; jacobian: the entries, outputs x inputs, row by output
    uint32 status = 3;
    string message = 4;
    uint32 line = 5;             // the line of the program's source the failure came from, 0 when not known
    bytes memory = 6;            // initialize and advance: the instance's memory after the call
    double clock_period = 7;     // initialize: the clock's period, 0 for none
}

message ProgramResponse {
    repeated ProgramOutcome outcomes = 1;
}

message ProviderFailure {
    uint64 sequence = 1;
    string code = 2;
    string message = 3;
    bool fatal = 4;
}

message EngineToProvider {
    oneof payload {
        HandshakeRequest handshake = 1;
        InitializeRequest initialize = 2;
        EvaluateBatchRequest evaluate_batch = 3;
        ShutdownRequest shutdown = 4;
        NodeEvaluateRequest node_evaluate = 6;
        CheckpointRequest checkpoint = 7;
        RestoreRequest restore = 8;
        ProgramInitializeRequest program_initialize = 9;
        ProgramEvaluateRequest program_evaluate = 10;
        ProgramAdvanceRequest program_advance = 11;
        ProgramSetMemoryRequest program_set_memory = 12;
        ProgramJacobianRequest program_jacobian = 13;
    }
}

message ProviderToEngine {
    oneof payload {
        HandshakeResponse handshake = 1;
        InitializeResponse initialize = 2;
        EvaluateBatchResponse evaluate_batch = 3;
        ShutdownResponse shutdown = 4;
        ProviderFailure failure = 5;
        NodeEvaluateResponse node_evaluate = 6;
        CheckpointResponse checkpoint = 7;
        RestoreResponse restore = 8;
        // The answer to every version 2 request (a set-memory request is answered with no outcomes).
        ProgramResponse program = 9;
    }
}
