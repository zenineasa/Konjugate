<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-Z0FIgnxX+d/F/B7wCNTXs37yvIz50s5wHY1AKWfoNbw='; img-src 'self' data:">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provider source</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
        {
            "imports": {
                "codemirror": "../../node_modules/codemirror/dist/index.js",
                "@codemirror/state": "../../node_modules/@codemirror/state/dist/index.js",
                "@codemirror/view": "../../node_modules/@codemirror/view/dist/index.js",
                "@codemirror/commands": "../../node_modules/@codemirror/commands/dist/index.js",
                "@codemirror/language": "../../node_modules/@codemirror/language/dist/index.js",
                "@codemirror/lang-cpp": "../../node_modules/@codemirror/lang-cpp/dist/index.js",
                "@codemirror/lang-python": "../../node_modules/@codemirror/lang-python/dist/index.js",
                "@codemirror/lint": "../../node_modules/@codemirror/lint/dist/index.js",
                "@codemirror/autocomplete": "../../node_modules/@codemirror/autocomplete/dist/index.js",
                "@codemirror/search": "../../node_modules/@codemirror/search/dist/index.js",
                "@lezer/common": "../../node_modules/@lezer/common/dist/index.js",
                "@lezer/highlight": "../../node_modules/@lezer/highlight/dist/index.js",
                "@lezer/lr": "../../node_modules/@lezer/lr/dist/index.js",
                "@lezer/cpp": "../../node_modules/@lezer/cpp/dist/index.js",
                "@lezer/python": "../../node_modules/@lezer/python/dist/index.js",
                "style-mod": "../../node_modules/style-mod/src/style-mod.js",
                "w3c-keyname": "../../node_modules/w3c-keyname/index.js",
                "crelt": "../../node_modules/crelt/index.js",
                "@marijn/find-cluster-break": "../../node_modules/@marijn/find-cluster-break/src/index.js"
            }
        }
    </script>
</head>
<body>
    <header class="titleBar">
        <div class="title"><img src="../../assets/icon.svg" alt=""><strong>Konjugate</strong><span id="editorTitle">Provider source</span></div>
        <div class="windowControls"><button id="minimize" type="button" aria-label="Minimize">−</button><button id="maximize" type="button" aria-label="Maximize">□</button><button id="close" class="close" type="button" aria-label="Close">×</button></div>
    </header>
    <div class="editorToolbar">
        <span id="editorKindLabel" class="kindBadge"></span>
        <span id="editorStatus" class="editorStatus" role="status">Checking…</span>
        <select id="editorThemeSelect" class="editorThemeSelect" aria-label="Editor color theme"></select>
        <button id="applyButton" class="applyButton" type="button">Apply</button>
    </div>
    <div id="editorThemePanel" class="editorThemePanel" hidden>
        <label><span>Background</span><input id="themeColor-background" type="color" data-theme-field="background"></label>
        <label><span>Text</span><input id="themeColor-foreground" type="color" data-theme-field="foreground"></label>
        <label><span>Gutter</span><input id="themeColor-gutterBackground" type="color" data-theme-field="gutterBackground"></label>
        <label><span>Line numbers</span><input id="themeColor-gutterForeground" type="color" data-theme-field="gutterForeground"></label>
        <label><span>Cursor &amp; accent</span><input id="themeColor-caret" type="color" data-theme-field="caret"></label>
        <label><span>Comment</span><input id="themeColor-comment" type="color" data-theme-field="comment"></label>
        <label><span>Keyword</span><input id="themeColor-keyword" type="color" data-theme-field="keyword"></label>
        <label><span>String</span><input id="themeColor-string" type="color" data-theme-field="string"></label>
        <label><span>Number</span><input id="themeColor-number" type="color" data-theme-field="number"></label>
        <label><span>Function</span><input id="themeColor-function" type="color" data-theme-field="function"></label>
        <label><span>Type</span><input id="themeColor-typeName" type="color" data-theme-field="typeName"></label>
    </div>
    <div id="editorHost"></div>
    <script type="module" src="renderer.mjs"></script>
</body>
</html>
